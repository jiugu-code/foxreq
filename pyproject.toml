[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "foxreq"
version = "0.1.0"
description = "Firefox NSS backed synchronous HTTP client for authorized testing"
requires-python = ">=3.10"
dependencies = ["certifi>=2025.8.3,<2027"]

[project.optional-dependencies]
test = ["cryptography>=41"]

[tool.maturin]
manifest-path = "crates/foxreq-py/Cargo.toml"
python-source = "python"
module-name = "foxreq._foxreq"
features = ["extension-module"]
